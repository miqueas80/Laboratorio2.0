name: NEXUS Voice V2 regression
on:
  push:
    branches: [main, feature/nexus-dual-voice-local-intelligence]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check app.js
      - run: node --check offline/core.js
