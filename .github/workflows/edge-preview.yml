name: Build NEXUS Edge isolated Android preview
on:
  workflow_dispatch:
  push:
    branches: [feature/nexus-x-edge-architecture-v1]
    paths:
      - ".github/workflows/edge-preview.yml"
      - "next/**"
      - "scripts/vendor-edge-transformers.mjs"
      - "scripts/vendor-edge-yjs.mjs"
      - "inventory.json"
      - "offline/**"
      - "docs/EDGE_RELEASE_GATES.md"
      - "documents-manifest.json"
      - "scripts/build-edge-documents.py"
      - "scripts/smoke-edge-documents-preview.mjs"
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.xlsx"
permissions:
  contents: read
concurrency:
  group: edge-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir pypdf==5.9.0
      - name: OCR for scanned PDFs during build only (not shipped to browser)
        shell: bash
        run: |
          if ! command -v pdftoppm || ! command -v tesseract || ! tesseract --list-langs 2>&1 | grep -qx spa; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-spa
          fi
          command -v tesseract
          command -v pdftoppm
          tesseract --list-langs 2>&1 | grep -x spa
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned browser runtimes without postinstall scripts
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @huggingface/transformers@3.8.1 yjs@13.6.32 esbuild@0.25.9 playwright-core@1.56.1
      - name: Build local ONNX/WASM and Yjs ESM libraries
        run: |
          node scripts/vendor-edge-transformers.mjs
          node scripts/vendor-edge-yjs.mjs
          test -s next/vendor/transformers/transformers.min.js
          test -s next/vendor/onnx/ort-wasm-simd-threaded.jsep.wasm
          test -s next/vendor/yjs/yjs.bundle.mjs
          node --check next/vendor/yjs/yjs.bundle.mjs
      - name: Assemble isolated PWA with pinned local runtimes and six canonical read-only documents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nexus-edge/next
          cp -a next/. dist/nexus-edge/next/
          cp inventory.json dist/nexus-edge/inventory.json
          # Reuse the verified production local engines in the ISOLATED preview.
          # No CDN, but the mobile assets add roughly 120 MiB uncompressed.
          mkdir -p dist/nexus-edge/offline
          cp -a offline/. dist/nexus-edge/offline/
          cp jsQR.js LICENSE-jsqr.txt icon-192.png icon-512.png dist/nexus-edge/
          mkdir -p dist/nexus-edge/docs
          cp docs/EDGE_RELEASE_GATES.md dist/nexus-edge/docs/EDGE_RELEASE_GATES.md
          python3 scripts/build-edge-documents.py --out dist/nexus-edge/next/snapshot/canonical-documents.json --copy-originals dist/nexus-edge
          cat > dist/nexus-edge/index.html <<'HTML'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=next/demo.html"><title>NEXUS Edge · Pruebas</title></head>
          <body><p>Versión experimental. <a href="next/demo.html">Abrir laboratorio Edge</a>.</p></body></html>
          HTML
          cat > dist/nexus-edge/COMO_PROBAR.txt <<'TXT'
          NEXUS-X Edge — LABORATORIO EXPERIMENTAL, NO ES PRODUCCIÓN.
          Requiere origen HTTPS o localhost para Service Worker, OPFS y micrófono.
          Sirve la carpeta nexus-edge y abre /next/demo.html. La descarga del
          modelo semántico es opcional y requiere consentimiento.
          El inventario de 111 registros es una COPIA ESTÁTICA de solo lectura.
          Se adjuntan COPIAS de los seis documentos canónicos originales y un
          índice de TEXTO local extraído y verificado por revision Git SHA-1.
          Usá "Indexar mis documentos en el Worker" para buscar en la copia.
          La lectura de archivos sin texto extraíble no equivale a OCR del PDF.
          No sustituye el código estable ni hace push a main.
          TXT
          du -sh dist/nexus-edge
      - name: Validate real six-document RAG in Chromium, then reload without Internet
        run: node scripts/smoke-edge-documents-preview.mjs dist/nexus-edge
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-edge-isolated-android-preview
          path: dist/nexus-edge/
          if-no-files-found: error
          retention-days: 5
